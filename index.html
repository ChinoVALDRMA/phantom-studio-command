<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Phantom Studio Command Center</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-color: #0b0c10;
  --bg-panel: #1f2833;
  --text-primary: #ffffff;
  --text-secondary: #c5c6c7;
  --accent-cyan: #66fcf1;
  --accent-cyan-dim: #45a29e;
  --accent-magenta: #ff00ff;
  --accent-amber: #ffb000;
  --border-color: rgba(255, 255, 255, 0.1);
  --glass-bg: rgba(31, 40, 51, 0.6);
  --font-main: 'Inter', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font-main);
  background-color: var(--bg-color);
  color: var(--text-primary);
  display: flex;
  height: 100vh;
  width: 100vw;
  overflow: hidden;
}

#app {
  display: flex;
  width: 100%;
  height: 100%;
}

.sidebar {
  width: 280px;
  background-color: var(--bg-panel);
  border-right: 1px solid var(--border-color);
  display: flex;
  flex-direction: column;
  padding: 24px;
  gap: 24px;
  flex-shrink: 0;
}

.logo h2 {
  font-weight: 800;
  letter-spacing: 2px;
  background: linear-gradient(90deg, var(--accent-cyan), var(--accent-magenta));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  font-size: 24px;
}

.logo .subtitle {
  font-size: 11px;
  color: var(--text-secondary);
  letter-spacing: 3px;
  font-family: var(--font-mono);
}

nav { display: flex; flex-direction: column; gap: 10px; }

.nav-btn {
  background: transparent; border: 1px solid transparent; color: var(--text-secondary);
  padding: 12px 16px; text-align: left; font-family: var(--font-main);
  font-size: 15px; font-weight: 600; border-radius: 8px; cursor: pointer; transition: all 0.3s ease;
  display: flex; align-items: center; gap: 8px;
}

.nav-btn:hover { background-color: rgba(255, 255, 255, 0.05); color: var(--text-primary); }
.nav-btn.active { background-color: rgba(102, 252, 241, 0.1); color: var(--accent-cyan); border: 1px solid rgba(102, 252, 241, 0.2); }

.sidebar-section {
  border-top: 1px solid var(--border-color);
  padding-top: 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.sidebar-section h4 { font-size: 12px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px; }

.main-content { flex: 1; display: flex; flex-direction: column; padding: 32px; overflow-y: auto; overflow-x: hidden; }
.view-section { display: none; width: 100%; }
.view-section.active { display: block; animation: fadeIn 0.4s ease; }

@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

.top-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; gap: 10px; }
.week-nav { background: transparent; border: 1px solid var(--border-color); color: var(--text-primary); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-family: var(--font-mono); font-size: 13px; white-space: nowrap; }
.week-nav:hover { background: rgba(255, 255, 255, 0.1); border-color: var(--accent-cyan); }
h1.view-title { font-size: 28px; font-weight: 800; }

.calendar-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px; }
.day-card { background: var(--glass-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 16px; cursor: pointer; transition: all 0.3s ease; backdrop-filter: blur(10px); }
.day-card:hover { transform: translateY(-4px); border-color: var(--accent-cyan-dim); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4); }
.day-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 12px; }
.day-name { font-weight: 800; font-size: 18px; color: var(--accent-cyan); }
.day-time { font-family: var(--font-mono); font-size: 11px; color: var(--text-secondary); }

.content-type { font-size: 14px; font-weight: 700; color: var(--text-primary); display: flex; align-items: center; gap: 8px; }
.hook-preview { font-style: italic; font-size: 13px; color: var(--text-secondary); line-height: 1.5; background: rgba(0,0,0,0.2); padding: 8px; border-radius: 6px; min-height: 60px; }

.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; }
.tag { background: rgba(255, 255, 255, 0.08); padding: 4px 8px; border-radius: 4px; font-size: 10px; font-family: var(--font-mono); text-transform: uppercase; }
.tag.collab { background: rgba(255, 0, 255, 0.15); color: #ff99ff; border: 1px solid rgba(255, 0, 255, 0.2); }
.tag.hashtag { background: rgba(102, 252, 241, 0.1); color: var(--accent-cyan); border: 1px solid rgba(102, 252, 241, 0.2); font-weight: bold; text-transform: lowercase; }

/* Growth Tracker View */
.account-list { display: flex; flex-direction: column; gap: 16px; margin-top: 24px; }
.account-card { background: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
.account-info h3 { font-size: 18px; margin-bottom: 4px; }
.account-info p { color: var(--text-secondary); font-family: var(--font-mono); font-size: 13px; }
.account-stats { flex: 1; max-width: 400px; }
.stat-bar-container { background: rgba(255,255,255,0.05); height: 10px; border-radius: 5px; margin: 8px 0; overflow: hidden; }
.stat-bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent-cyan), var(--accent-magenta)); width: 0; transition: width 0.8s ease; }
.stat-labels { display: flex; justify-content: space-between; font-size: 12px; font-family: var(--font-mono); }

.btn-add-account { background: var(--accent-cyan); color: var(--bg-color); border: none; padding: 10px 20px; border-radius: 8px; font-weight: 700; cursor: pointer; margin-top: 16px; }

/* Member Section */
.member-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 24px; margin-top: 24px; }
.member-card { background: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 16px; padding: 24px; position: relative; overflow: hidden; }
.member-card::after { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: var(--accent-cyan); }
.member-card.tilin::after { background: var(--accent-magenta); }
.member-card.codex::after { background: #ff5555; }
.member-card.ridd::after { background: var(--accent-amber); }
.member-card.vytruz::after { background: #55ff55; }

.member-header { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
.member-avatar { width: 60px; height: 60px; background: rgba(255,255,255,0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; }

.member-topics { background: rgba(0,0,0,0.2); padding: 16px; border-radius: 12px; }
.member-topics h5 { font-size: 12px; text-transform: uppercase; margin-bottom: 10px; color: var(--text-secondary); }
.topic-tag { display: inline-block; background: rgba(255,255,255,0.05); padding: 4px 10px; border-radius: 15px; font-size: 12px; margin: 0 4px 4px 0; border: 1px solid rgba(255,255,255,0.1); }

/* Modal */
.modal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(11, 12, 16, 0.85); backdrop-filter: blur(8px); display: flex; justify-content: center; align-items: center; z-index: 1000; transition: opacity 0.3s ease; }
.modal.hidden { opacity: 0; pointer-events: none; }
.modal-content { background: var(--bg-panel); width: 95%; max-width: 900px; max-height: 90vh; border-radius: 20px; border: 1px solid var(--border-color); box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6); overflow-y: auto; position: relative; padding: 30px; }
.close-btn { position: absolute; top: 15px; right: 20px; background: transparent; border: none; color: var(--text-secondary); font-size: 32px; cursor: pointer; }

/* --- AGGRESSIVE RESPONSIVE DESIGN --- */
@media (max-width: 900px) {
  body {
    display: block !important;
    overflow-y: auto !important;
    height: auto !important;
    width: 100% !important;
  }
  
  #app {
    display: block !important;
  }

  .sidebar {
    width: 100% !important;
    height: auto !important;
    padding: 20px !important;
    border-right: none !important;
    border-bottom: 1px solid var(--border-color) !important;
    position: sticky !important;
    top: 0 !important;
    z-index: 100 !important;
    background: rgba(31, 40, 51, 0.98) !important;
    backdrop-filter: blur(15px) !important;
  }
  
  .logo {
    display: flex !important;
    align-items: center !important;
    justify-content: space-between !important;
    margin-bottom: 15px !important;
  }
  
  .logo h2 { font-size: 20px !important; }
  .logo .subtitle { display: none !important; }
  
  nav {
    flex-direction: row !important;
    overflow-x: auto !important;
    padding-bottom: 10px !important;
    gap: 10px !important;
    -webkit-overflow-scrolling: touch !important;
    width: 100% !important;
  }
  
  .nav-btn {
    white-space: nowrap !important;
    padding: 10px 15px !important;
    font-size: 13px !important;
    flex-shrink: 0 !important;
    border: 1px solid rgba(255,255,255,0.1) !important;
  }
  
  .sidebar-section { display: none !important; }
  
  .main-content {
    padding: 20px !important;
    width: 100% !important;
    height: auto !important;
    overflow-y: visible !important;
  }
  
  .top-nav {
    flex-direction: column !important;
    gap: 15px !important;
    text-align: center !important;
  }
  
  .view-title { font-size: 20px !important; }
  
  .calendar-grid {
    grid-template-columns: 1fr !important;
  }
}
</style>
</head>
<body>
  <div id="app">
    <aside id="sidebar" class="sidebar">
      <div class="logo">
        <h2>PHANTOM</h2>
        <span class="subtitle">STUDIO COMMAND</span>
      </div>
      <nav>
        <button class="nav-btn active" onclick="switchView('calendar-view', this)">📅 Calendario</button>
        <button class="nav-btn" onclick="switchView('growth-view', this)">📈 Growth</button>
        <button class="nav-btn" onclick="switchView('members-view', this)">👥 Equipo</button>
        <button class="nav-btn" onclick="switchView('ideas-view', this)">💡 Ideas</button>
      </nav>
      
      <div class="sidebar-section">
        <h4>Meta Principal</h4>
        <div class="growth-widget">
          <div class="progress-bar" style="background:rgba(255,255,255,0.05); height:8px; border-radius:4px; overflow:hidden;">
            <div class="progress-fill" id="global-progress" style="width: 0%; height:100%; background:var(--accent-cyan);"></div>
          </div>
          <div class="progress-text" style="font-size:11px; margin-top:5px;"><span id="global-followers">0</span> / 1,000</div>
        </div>
      </div>
    </aside>

    <main class="main-content">
      <!-- CALENDAR VIEW -->
      <section id="calendar-view" class="view-section active">
        <header class="top-nav">
          <button class="week-nav" onclick="changeWeek(-1)">← Anterior</button>
          <h1 id="week-title" class="view-title">Semana Actual</h1>
          <button class="week-nav" onclick="changeWeek(1)">Siguiente →</button>
        </header>
        <div id="calendar-grid" class="calendar-grid"></div>
      </section>

      <!-- GROWTH VIEW -->
      <section id="growth-view" class="view-section">
        <h1 class="view-title">Growth Tracker</h1>
        <div id="account-list" class="account-list"></div>
        <button class="btn-add-account" onclick="addAccount()">+ Añadir Cuenta</button>
      </section>

      <!-- MEMBERS VIEW -->
      <section id="members-view" class="view-section">
        <h1 class="view-title">Estrategia por Artista</h1>
        <div id="member-grid" class="member-grid"></div>
      </section>

      <!-- IDEAS VIEW -->
      <section id="ideas-view" class="view-section">
        <h1 class="view-title">Banco de Ideas</h1>
        <div id="ideas-container"></div>
        <button class="btn-refresh-ideas" onclick="renderIdeas()" style="margin-top: 20px;">Generar Nuevas Ideas</button>
      </section>

      <!-- MODAL -->
      <div id="content-detail-modal" class="modal hidden" onclick="closeModalOutside(event)">
        <div class="modal-content">
          <button class="close-btn" onclick="closeModal()">×</button>
          <div id="modal-body"></div>
        </div>
      </div>
    </main>
  </div>
  
<script>
// --- DATA ---
const pillars = [
  { name: '🎛️ Studio Workflow', type: 'Solo', difficulty: 'Fácil', format: 'Short', hashtags: ['#musicproduction', '#studioflow', '#ableton', '#techhouse', '#beatmaking'] },
  { name: '🎹 Sound Design Hack', type: 'Solo', difficulty: 'Fácil', format: 'Short', hashtags: ['#sounddesign', '#serum', '#musicproducer', '#audioprocessing', '#abletonhacks'] },
  { name: '📚 Tutorial Especializado', type: 'Solo', difficulty: 'Medio', format: 'Short', hashtags: ['#productiontips', '#mezclaymaster', '#musicproducer', '#tutorial', '#learnmusic'] },
  { name: '🎧 Teaser Inédito', type: 'Solo', difficulty: 'Fácil', format: 'Short', hashtags: ['#newmusic', '#upcomingrelease', '#phantomstudio', '#unreleased', '#snippet'] },
  { name: '🤝 Phantom Collab', type: 'Collab', difficulty: 'Medio', format: 'Short', hashtags: ['#collaboration', '#studiovibes', '#phantomteam', '#makingof', '#mexicocity'] },
  { name: '😂 Realidad del Productor', type: 'Solo', difficulty: 'Fácil', format: 'Short', hashtags: ['#producermemes', '#relatable', '#studiolife', '#producerhumor', '#djproblems'] },
  { name: '💬 Análisis/Storytelling', type: 'Solo', difficulty: 'Medio', format: 'Short', hashtags: ['#musicstory', '#behindthescenes', '#musicbusiness', '#inspiration', '#artistjourney'] },
  { name: '🧠 Mindset & Psicología', type: 'Solo', difficulty: 'Medio', format: 'Short', hashtags: ['#lifestyle', '#psychology', '#mindset', '#creativeprocess', '#phantomidentity'] },
  { name: '🔥 Live Jam / Hardware', type: 'Solo/Collab', difficulty: 'Difícil', format: 'Short', hashtags: ['#liveset', '#hardware', '#abletonpush', '#synthjam', '#performance'] },
  { name: '📸 Gear Review', type: 'Solo', difficulty: 'Fácil', format: 'Carousel', hashtags: ['#studiophoto', '#gearporn', '#shuresm7b', '#phantomstudio', '#musicgear'] },
  { name: '🎬 Masterclass (Long Form)', type: 'Solo', difficulty: 'Difícil', format: 'Long', hashtags: ['#deepdive', '#youtube', '#musicindustry', '#masterclass', '#producertalk'] },
  { name: '🎤 Vocal/Freestyle Take', type: 'Collab', difficulty: 'Difícil', format: 'Short', hashtags: ['#freestyle', '#vocalrecording', '#improvisation', '#livevocals', '#phantomvibes'] }
];

const hooks = [
  "Descubrí un truco en Ableton que cambió por completo mi forma de mezclar...",
  "El secreto que nadie te dice sobre cobrar regalías como artista independiente...",
  "¿Qué pasa si aplicas distorsión armónica a un kick de Tech House?",
  "POV: Construiste tu propio controlador MIDI y suena así...",
  "La técnica de ecualización que hace que tu voz corte cualquier mezcla...",
  "Un beat genérico vs Un beat con sound design avanzado",
  "Grabar en tu cuarto vs Grabar con un Shure SM7B en Phantom Studio",
  "Cómo registrar tu nombre artístico en México en 3 simples pasos...",
  "Por qué decidí mezclar ingeniería mecatrónica con producción musical...",
  "Lo que aprendí negociando mi primer split de regalías..."
];

const team = [
  { id: 'chino', name: 'ElChinoVALDRM', role: 'Fundador / Productor', avatar: '👻', color: 'tilin', topics: ['Live setup (Ableton Push)', 'Tech House / Afrohouse', 'Piano & Sax en vivo', 'Visión Phantom Studio'] },
  { id: 'tilin', name: 'Tilin', role: 'Artista / Jazz Spirit', avatar: '🎷', color: 'tilin', topics: ['Jazz fusion armonía', 'Psicodelia con pedales', 'Guitarra eléctrica en beats', 'Mentalidad creativa'] },
  { id: 'codex', name: 'Codex (Ian)', role: 'Productor / Mechatronics', avatar: '🤖', color: 'codex', topics: ['Controladores custom (Mecatrónica)', 'Reggaetón & Guaracha pesada', 'Storytelling urbano Ecatepec', 'Freestyle crudo'] },
  { id: 'ridd', name: 'Ridd (Mau)', role: 'Cantante / Legal', avatar: '⚖️', color: 'ridd', topics: ['Derechos de autor / Copyright', 'Registro de obras en México', 'Entrenamiento vocal', 'Composición de letras'] },
  { id: 'vytruz', name: 'Vytruz (Allan)', role: 'Productor / Finance', avatar: '📉', color: 'vytruz', topics: ['Finanzas y ROI para artistas', 'Workflow Mac Studio / SM7B', 'Bass Music & Serum Design', 'Optimización de CPU/Serum'] }
];

const effects = ["Transición: Whip pan", "Toma: Close-up manos", "Edición: Beat sync cut", "Visual: Glitch analog", "POV produciendo", "Color: Film Noir", "Zoom punch"];

// --- LOGIC ---
let currentWeekOffset = 0;

function createPRNG(seed) {
  let s = seed % 2147483647;
  if (s <= 0) s += 2147483646;
  return () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
}

function getRandom(arr, prng) { return arr[Math.floor(prng() * arr.length)]; }

function switchView(viewId, btn) {
  document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(viewId).classList.add('active');
  btn.classList.add('active');
  window.scrollTo(0,0);
}

function renderCalendar() {
  const date = new Date();
  date.setDate(date.getDate() + (currentWeekOffset * 7));
  const weekNum = Math.ceil((((date - new Date(date.getFullYear(), 0, 1)) / 86400000) + 1) / 7);
  document.getElementById('week-title').innerText = `Semana ${weekNum}, ${date.getFullYear()}`;
  
  const prng = createPRNG(date.getFullYear() * 1000 + weekNum);
  const container = document.getElementById('calendar-grid');
  container.innerHTML = '';
  
  ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado', 'Domingo'].forEach((day, i) => {
    const pillar = pillars[i % pillars.length];
    const hook = getRandom(hooks, prng);
    const card = document.createElement('div');
    card.className = 'day-card';
    card.innerHTML = `
      <div class="day-header"><span class="day-name">${day}</span><span class="day-time">18:00 - 21:00</span></div>
      <div class="content-type">${pillar.name}</div>
      <div class="hook-preview">"${hook}"</div>
      <div class="tags">${pillar.hashtags.map(h => `<span class="tag hashtag">${h}</span>`).join('')}</div>
    `;
    card.onclick = () => openModal(day, pillar, hook, prng);
    container.appendChild(card);
  });
}

function openModal(day, pillar, hook, prng) {
  const modal = document.getElementById('content-detail-modal');
  const body = document.getElementById('modal-body');
  body.innerHTML = `
    <h2 style="color:var(--accent-cyan); margin-bottom:20px;">${day} - ${pillar.name}</h2>
    <p><strong>Hook:</strong> "${hook}"</p>
    <div style="background:rgba(0,0,0,0.3); padding:15px; border-radius:10px; margin-top:20px; border-left:4px solid var(--accent-magenta);">
      <strong>Visual:</strong> ${getRandom(effects, prng)}<br><br>
      <strong>Tip:</strong> Enfócate en el valor directo en los primeros 3 segundos.
    </div>
    <div style="margin-top:20px; color:var(--accent-magenta); font-family:monospace;">${pillar.hashtags.join(' ')} #phantomstudio</div>
  `;
  modal.classList.remove('hidden');
}

function renderMemberStrategies() {
  const container = document.getElementById('member-grid');
  container.innerHTML = '';
  team.forEach(m => {
    const card = document.createElement('div');
    card.className = `member-card ${m.color}`;
    card.innerHTML = `
      <div class="member-header"><div class="member-avatar">${m.avatar}</div><div><h3>${m.name}</h3><p style="font-size:12px; color:var(--accent-cyan);">${m.role}</p></div></div>
      <div class="member-topics">
        <h5>Misión Semanal</h5>
        <div style="background:rgba(102,252,241,0.1); padding:10px; border-radius:8px; margin-bottom:10px; border-left:3px solid var(--accent-cyan); font-size:13px;"><strong>🎯 Foco:</strong> ${m.topics[0]}</div>
        ${m.topics.slice(1).map(t => `<span class="topic-tag">${t}</span>`).join('')}
      </div>
    `;
    container.appendChild(card);
  });
}

function renderIdeas() {
  const container = document.getElementById('ideas-container');
  container.innerHTML = '';
  const prng = createPRNG(Date.now());
  for(let i=0; i<3; i++) {
    const card = document.createElement('div');
    card.className = 'idea-card';
    card.innerHTML = `<div class="idea-content"><h4>Idea #${i+1}</h4><p>"${getRandom(hooks, prng)}"</p></div>`;
    container.appendChild(card);
  }
}

function changeWeek(dir) { currentWeekOffset += dir; renderCalendar(); }
function closeModal() { document.getElementById('content-detail-modal').classList.add('hidden'); }
function closeModalOutside(e) { if(e.target.id === 'content-detail-modal') closeModal(); }
function addAccount() { alert('Función para agregar cuenta (Próximamente)'); }

window.onload = () => { renderCalendar(); renderMemberStrategies(); renderIdeas(); };
</script>
</body>
</html>
